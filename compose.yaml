services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: bego-frontend-test:local
    container_name: bego-frontend-test
    user: "101:101"
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
