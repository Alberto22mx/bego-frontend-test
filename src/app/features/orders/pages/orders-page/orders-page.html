<main class="orders-page">
  <app-orders-tabs />

  <div class="orders-page__content">
    <label class="search">
      <span class="visually-hidden">Buscar pedidos</span>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7" />
        <path d="m16 16 4 4" />
      </svg>
      <input type="search" placeholder="Search cargo orders" />
    </label>

    @switch (status()) {
      @case ('loading') {
        <div class="state" role="status">
          <span class="spinner" aria-hidden="true"></span>
          <p>Loading upcoming orders...</p>
        </div>
      }

      @case ('error') {
        <section class="state" role="alert">
          <p>We couldn't load your upcoming orders.</p>
          <button type="button" (click)="retry()">Try again</button>
        </section>
      }

      @case ('empty') {
        <section class="state">
          <p>No upcoming orders found.</p>
        </section>
      }

      @case ('success') {
        <app-order-list [orders]="orders()" />
      }
    }
  </div>
</main>
