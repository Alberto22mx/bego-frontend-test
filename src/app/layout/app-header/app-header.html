<header class="app-header">
  <button class="icon-button" type="button" [attr.aria-label]="i18n.translate('back')" (click)="goBack()">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="m15 18-6-6 6-6" />
    </svg>
  </button>

  <h1>{{ title() }}</h1>

  <div class="header-actions">
    <button class="language-button" type="button" (click)="i18n.toggleLanguage()">
      {{ i18n.language() === 'en' ? 'ES' : 'EN' }}
    </button>
    <button class="icon-button" type="button" [attr.aria-label]="i18n.translate('notifications')">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18 8a6 6 0 0 0-12 0v3.2c0 2.1.8 3.5 2 4.8H4c1.2-1.3 2-2.7 2-4.8V8M9.5 20h5" />
      </svg>
    </button>
  </div>
</header>
